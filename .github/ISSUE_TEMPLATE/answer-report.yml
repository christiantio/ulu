# The app links here, prefilled, when VITE_REPORT_URL isn't set (src/game/report.ts). It fills the fields by id
# (?kind=…&prompt=…&dive=…&answer=…), so keep these ids, and keep the "kind" options equal to REPORT_KINDS there.
name: Answer report
description: A missing answer, a wrong answer, or a tier that feels off.
title: "Content: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks! One prompt per report, please. Heads up: anyone who can see this repo can read the report, so it may spoil the prompt for people who haven't played it yet.
  - type: dropdown
    id: kind
    attributes:
      label: What's wrong?
      options:
        - Missing answer
        - Wrong answer
        - Tier feels off
    validations:
      required: true
  - type: input
    id: prompt
    attributes:
      label: Prompt
      description: The prompt id if you know it, or the prompt text as shown.
      placeholder: "transport-ccl-stations, or \"Name a station on the Circle Line\""
    validations:
      required: true
  - type: input
    id: dive
    attributes:
      label: Dive date
      description: The Singapore date (YYYY-MM-DD) or the number from the share text (e.g. "Ulu #3"). Write "unlimited" if it came up in Unlimited.
      placeholder: "2026-10-31, Ulu #5 or unlimited"
  - type: input
    id: answer
    attributes:
      label: The answer
      description: What you typed, or the answer you're reporting. Separate several with semicolons.
      placeholder: "Bras Basah"
    validations:
      required: true
  - type: dropdown
    id: suggested-tier
    attributes:
      label: Suggested tier
      description: For a missing answer or a tier that feels off.
      options:
        - common (Everybody Say, 10)
        - trap (Act Smart, 15)
        - solid (Can Lah, 30)
        - rare (Steady, 60)
        - ulu (Damn Ulu, 85)
        - gem (Sibei Ulu, 100)
        - Not sure
  - type: textarea
    id: details
    attributes:
      label: Details and sources
      description: Why it should change. For a missing or wrong answer, a link to a source helps a lot.
    validations:
      required: true
